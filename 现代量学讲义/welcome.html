<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5a623">
<title>现代量学实战体系</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root {
  --bg: #0a0e14;
  --surface: #151b23;
  --accent: #f5a623;
  --text: #e8edf4;
  --text-dim: #8899a6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.logo {
  width: 120px;
  height: 120px;
  background: linear-gradient(135deg, var(--accent) 0%, #e67e22 100%);
  border-radius: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px;
  font-weight: 800;
  color: #000;
  margin-bottom: 24px;
  box-shadow: 0 8px 24px rgba(245,166,35,0.4);
}
h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 8px;
  text-align: center;
}
.subtitle {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 40px;
  text-align: center;
}
.hint {
  background: var(--surface);
  border-radius: 16px;
  padding: 20px;
  max-width: 320px;
  text-align: center;
}
.hint h3 {
  font-size: 16px;
  margin-bottom: 12px;
  color: var(--accent);
}
.hint p {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.6;
}
.hint .steps {
  margin-top: 16px;
  text-align: left;
  font-size: 12px;
  color: var(--text-dim);
}
.hint .steps li {
  margin-bottom: 6px;
  padding-left: 4px;
}
</style>
</head>
<body>

<div class="logo">量</div>
<h1>现代量学实战体系</h1>
<div class="subtitle">黑马王子 · 第一阶段课程</div>

<div class="hint">
  <h3>添加到主屏幕</h3>
  <p>点击右上角菜单，选择"添加到主屏幕"</p>
  <ul class="steps">
    <li>iPhone：点分享按钮 → 添加到主屏幕</li>
    <li>Android：点三点菜单 → 安装应用</li>
  </ul>
  <p style="margin-top:12px;font-size:12px;color:var(--text-muted)">添加后点击图标即可在原应用内打开</p>
</div>

<script>
// 注册Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => console.log('Service Worker registered'));
}
</script>

</body>
</html>
