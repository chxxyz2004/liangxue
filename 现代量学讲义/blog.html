<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="量学实战博客 - 基于真实数据的量化交易学习笔记">
<title>量学实战博客</title>
<style>
:root {
  --primary: #6366f1;
  --primary-light: #818cf8;
  --accent: #f59e0b;
  --success: #10b981;
  --danger: #ef4444;
  --bg: #0f172a;
  --bg-card: #1e293b;
  --bg-card-hover: #253349;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --border: #334155;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --radius: 16px;
  --radius-sm: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  line-height: 1.7;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

/* 动画 */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideDown { from{transform:translateY(-100%)} to{transform:translateY(0)} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

/* 滚动进度条 */
.progress-bar {
  position: fixed; top: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  z-index: 9999; transition: width 0.1s;
}

/* 导航 */
.nav {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  background: rgba(15,23,42,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; z-index: 100;
  animation: slideDown 0.4s ease;
}
.nav-logo {
  font-size: 18px; font-weight: 800;
  background: linear-gradient(135deg, var(--primary-light), var(--accent));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  cursor: pointer;
}
.nav-links { display: flex; gap: 16px; }
.nav-link {
  font-size: 13px; color: var(--text-dim);
  padding: 6px 12px; border-radius: 8px;
  transition: all 0.2s; cursor: pointer;
}
.nav-link:hover { color: var(--primary-light); background: rgba(99,102,241,0.1); }
.nav-link.active { color: var(--primary-light); }

/* Hero */
.hero {
  margin-top: 60px;
  padding: 80px 20px 100px;
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #312e81 70%, #4c1d95 100%);
  position: relative; overflow: hidden; text-align: center;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 600px 400px at 30% 30%, rgba(99,102,241,0.3), transparent),
              radial-gradient(ellipse 400px 300px at 70% 70%, rgba(245,158,11,0.15), transparent);
}
.hero-particles {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.particle {
  position: absolute; width: 4px; height: 4px;
  background: rgba(99,102,241,0.5); border-radius: 50%;
  animation: float 6s ease-in-out infinite;
}
.hero-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
.hero h1 {
  font-size: clamp(28px, 5vw, 42px); font-weight: 900;
  background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #fbbf24 100%);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: gradientShift 4s ease infinite;
  margin-bottom: 16px;
}
.hero p { font-size: 15px; color: rgba(255,255,255,0.7); margin-bottom: 24px; }

/* 搜索 */
.search-wrap { max-width: 500px; margin: 0 auto; position: relative; }
.search-input {
  width: 100%; padding: 14px 50px 14px 20px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px; color: #fff; font-size: 14px; outline: none;
  transition: all 0.3s; backdrop-filter: blur(10px);
}
.search-input::placeholder { color: rgba(255,255,255,0.4); }
.search-input:focus {
  background: rgba(255,255,255,0.12);
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
}
.search-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px; background: var(--primary);
  border: none; border-radius: 8px; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.search-btn:hover { background: var(--primary-light); }

/* 布局 */
.layout {
  max-width: 960px; margin: 0 auto;
  padding: 0 16px 80px;
  display: grid; grid-template-columns: 1fr 260px; gap: 24px;
}
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* 文章列表 */
.posts { display: flex; flex-direction: column; gap: 16px; margin-top: -40px; position: relative; z-index: 2; }
.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative; overflow: hidden;
}
.post-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  opacity: 0; transition: opacity 0.2s;
}
.post-card:hover {
  transform: translateY(-3px);
  border-color: var(--primary);
  box-shadow: var(--shadow);
}
.post-card:hover::before { opacity: 1; }
.post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.post-category {
  background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.3);
  border-radius: 6px; padding: 3px 10px; font-size: 11px; color: var(--primary-light);
}
.post-date { font-size: 11px; color: var(--text-muted); }
.post-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
.post-excerpt { font-size: 13px; color: var(--text-dim); line-height: 1.7; margin-bottom: 14px; }
.post-footer { display: flex; align-items: center; justify-content: space-between; }
.post-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.post-tag {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 8px; font-size: 10px; color: var(--text-muted);
}
.post-read { font-size: 12px; color: var(--primary-light); display: flex; align-items: center; gap: 4px; transition: gap 0.2s; }
.post-card:hover .post-read { gap: 8px; }

/* 侧边栏 */
.sidebar { display: flex; flex-direction: column; gap: 16px; }
.sidebar-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 16px;
}
.sidebar-title {
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.cat-list { list-style: none; }
.cat-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; cursor: pointer; transition: color 0.2s;
  border-bottom: 1px solid rgba(51,65,85,0.5);
}
.cat-item:last-child { border-bottom: none; }
.cat-item:hover { color: var(--primary-light); }
.cat-name { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.cat-count { font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 10px; }

/* 文章详情 */
.post-detail { display: none; animation: fadeIn 0.3s ease; }
.post-detail.active { display: block; }
.post-detail-header {
  margin-top: 60px; padding: 40px 20px 30px;
  background: linear-gradient(180deg, rgba(30,27,75,0.6) 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
}
.post-back {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 14px; font-size: 12px;
  color: var(--text-dim); cursor: pointer; transition: all 0.2s; margin-bottom: 20px;
}
.post-back:hover { background: rgba(99,102,241,0.15); color: var(--primary-light); }
.post-detail-title { font-size: clamp(22px, 4vw, 32px); font-weight: 800; line-height: 1.3; margin-bottom: 16px; }
.post-detail-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
.post-detail-body { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
.post-content {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 32px;
}
.post-content h1 { font-size: 22px; margin: 0 0 20px; padding-bottom: 16px; border-bottom: 2px solid var(--border); color: #fbbf24; }
.post-content h2 { font-size: 18px; margin: 28px 0 14px; color: #60a5fa; padding-left: 14px; border-left: 3px solid var(--primary); }
.post-content h3 { font-size: 15px; margin: 22px 0 10px; color: var(--text); }
.post-content p { font-size: 14px; line-height: 1.9; margin: 12px 0; color: var(--text-dim); }
.post-content ul { margin: 12px 0 12px 20px; }
.post-content li { font-size: 14px; line-height: 1.8; margin: 6px 0; color: var(--text-dim); }
.post-content li::marker { color: var(--primary); }
.post-content strong { color: var(--text); }
.post-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
.post-content th, .post-content td { padding: 10px 12px; border: 1px solid var(--border); text-align: left; }
.post-content th { background: var(--bg-card-alt); color: var(--text); font-weight: 600; }
.post-content td { color: var(--text-dim); }
.post-content tr:hover td { background: rgba(99,102,241,0.05); }
.post-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.post-content code { background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #fbbf24; }
.post-content blockquote { border-left: 3px solid var(--primary); padding: 14px 18px; margin: 18px 0; background: rgba(99,102,241,0.08); border-radius: 0 10px 10px 0; }
.post-content blockquote p { margin: 0; color: var(--text); }
/* HTML内容样式 */
.post-content.html-content { padding: 0; overflow: hidden; }
.post-content.html-content > * { border-radius: var(--radius); }

/* 加载状态 */
.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.spinner {
  width: 36px; height: 36px; margin: 0 auto 16px;
  border: 3px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
.error { text-align: center; padding: 60px 20px; color: #f87171; }

/* 回到顶部 */
.back-top {
  position: fixed; bottom: 80px; right: 20px;
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--primary), #a855f7);
  border: none; border-radius: 50%; color: #fff;
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(99,102,241,0.4);
  transition: all 0.3s; opacity: 0; transform: translateY(20px);
  pointer-events: none; z-index: 90;
}
.back-top.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.back-top:hover { transform: translateY(-4px) scale(1.1); }

/* 底部导航 */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15,23,42,0.95); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
.bottom-nav-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 4px 16px; color: var(--text-muted);
  font-size: 9px; background: none; border: none; cursor: pointer;
  transition: all 0.2s;
}
.bottom-nav-item.active { color: var(--primary-light); }
.bottom-nav-item .icon { font-size: 20px; transition: transform 0.3s; }
.bottom-nav-item:hover .icon { transform: scale(1.15); }
.bottom-nav-item:active .icon { transform: scale(0.9); }

/* 滚动条 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

/* 选中 */
::selection { background: rgba(99,102,241,0.3); color: #fff; }
</style>
</head>
<body>

<!-- 进度条 -->
<div class="progress-bar" id="progressBar"></div>

<!-- 导航 -->
<nav class="nav">
  <div class="nav-logo" onclick="goHome()">量学实战博客</div>
  <div class="nav-links">
    <span class="nav-link active" onclick="filterPosts('all')">全部</span>
    <span class="nav-link" onclick="filterPosts('日报')">日报</span>
    <span class="nav-link" onclick="filterPosts('案例')">案例</span>
    <span class="nav-link" onclick="filterPosts('讲义')">讲义</span>
  </div>
</nav>

<!-- 首页 -->
<div id="homeView">
<div class="hero">
  <div class="hero-particles">
    <div class="particle" style="left:10%;top:20%;animation-delay:0s"></div>
    <div class="particle" style="left:30%;top:60%;animation-delay:-2s"></div>
    <div class="particle" style="left:60%;top:30%;animation-delay:-4s"></div>
    <div class="particle" style="left:80%;top:70%;animation-delay:-1s"></div>
  </div>
  <div class="hero-content">
    <h1>量学实战博客</h1>
    <p>基于真实数据的量化交易学习笔记<br>每日更新 · 深度分析 · 实战验证</p>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索文章..." oninput="handleSearch(this.value)">
      <button class="search-btn" onclick="handleSearch(document.getElementById('searchInput').value)">🔍</button>
    </div>
  </div>
</div>

<div class="layout">
  <main>
    <div class="posts" id="postsList">
      <div class="loading"><div class="spinner"></div><div>加载文章中...</div></div>
    </div>
  </main>
  
  <aside class="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title">文章分类</div>
      <ul class="cat-list" id="catList">
        <li class="cat-item" onclick="filterPosts('all')"><span class="cat-name">📋 全部</span><span class="cat-count" id="countAll">-</span></li>
        <li class="cat-item" onclick="filterPosts('日报')"><span class="cat-name">📊 复盘日报</span><span class="cat-count" id="countDaily">-</span></li>
        <li class="cat-item" onclick="filterPosts('预案')"><span class="cat-name">📋 盘前预案</span><span class="cat-count" id="countPlan">-</span></li>
        <li class="cat-item" onclick="filterPosts('案例')"><span class="cat-name">📈 个股案例</span><span class="cat-count" id="countCase">-</span></li>
        <li class="cat-item" onclick="filterPosts('讲义')"><span class="cat-name">📚 讲义课程</span><span class="cat-count" id="countLecture">-</span></li>
        <li class="cat-item" onclick="filterPosts('路线')"><span class="cat-name">🗺️ 学习路线</span><span class="cat-count" id="countRoute">-</span></li>
        <li class="cat-item" onclick="filterPosts('报告')"><span class="cat-name">📉 分析报告</span><span class="cat-count" id="countReport">-</span></li>
      </ul>
    </div>
    
    <div class="sidebar-card">
      <div class="sidebar-title">热门标签</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <span class="post-tag" onclick="searchTag('倍量柱')">倍量柱</span>
        <span class="post-tag" onclick="searchTag('黄金线')">黄金线</span>
        <span class="post-tag" onclick="searchTag('右确认')">右确认</span>
        <span class="post-tag" onclick="searchTag('左证明')">左证明</span>
        <span class="post-tag" onclick="searchTag('止损')">止损</span>
        <span class="post-tag" onclick="searchTag('仓位')">仓位</span>
        <span class="post-tag" onclick="searchTag('对倒')">对倒</span>
        <span class="post-tag" onclick="searchTag('产业链')">产业链</span>
      </div>
    </div>
    
    <div class="sidebar-card">
      <div class="sidebar-title">系统状态</div>
      <div style="font-size:12px;color:var(--text-dim);line-height:2">
        <div>📊 持仓股票: <span style="color:var(--success)">8只</span></div>
        <div>📈 K线数据: <span id="stockCount">-</span>只</div>
        <div>📝 文章总数: <span id="postCount">-</span>篇</div>
        <div>🕐 最近更新: <span id="lastUpdate">-</span></div>
      </div>
    </div>
  </aside>
</div>
</div>

<!-- 文章详情 -->
<div id="postView" class="post-detail">
  <div class="post-detail-header">
    <button class="post-back" onclick="goHome()">← 返回首页</button>
    <div class="post-detail-meta" id="postMeta"></div>
    <h1 class="post-detail-title" id="postDetailTitle"></h1>
  </div>
  <div class="post-detail-body">
    <div class="post-content" id="postDetailContent">
      <div class="loading"><div class="spinner"></div><div>加载中...</div></div>
    </div>
  </div>
</div>

<!-- 回到顶部 -->
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- 底部导航 -->
<div class="bottom-nav">
  <button class="bottom-nav-item active" onclick="goHome()"><span class="icon">🏠</span><span>首页</span></button>
  <button class="bottom-nav-item" onclick="filterPosts('日报')"><span class="icon">📊</span><span>日报</span></button>
  <button class="bottom-nav-item" onclick="filterPosts('案例')"><span class="icon">📈</span><span>案例</span></button>
  <button class="bottom-nav-item" onclick="filterPosts('讲义')"><span class="icon">📚</span><span>讲义</span></button>
</div>

<script>
// ===== 状态管理 =====
var currentFilter = 'all';
var allPosts = [];
var currentView = 'home';

// ===== 页面切换 =====
function showView(view) {
  document.getElementById('homeView').style.display = view === 'home' ? 'block' : 'none';
  document.getElementById('postView').classList.toggle('active', view === 'post');
  currentView = view;
  window.scrollTo(0, 0);
  updateNav();
}

function goHome() {
  showView('home');
  currentFilter = 'all';
  updateNavLinks();
}

function updateNav() {
  var items = document.querySelectorAll('.bottom-nav-item');
  items.forEach(function(i, idx) { i.classList.toggle('active', idx === 0); });
}

function updateNavLinks() {
  var links = document.querySelectorAll('.nav-link');
  links.forEach(function(l) { l.classList.remove('active'); });
  var map = {'all':0,'日报':1,'案例':2,'讲义':3};
  if(map[currentFilter] !== undefined) links[map[currentFilter]].classList.add('active');
}

// ===== 加载文章列表 =====
function loadPosts(category) {
  var url = '/api/posts?limit=50';
  if (category && category !== 'all') url += '&category=' + category;
  
  fetch(url)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allPosts = data.posts || [];
      renderPosts(allPosts);
      updateStats(data);
    })
    .catch(function() {
      document.getElementById('postsList').innerHTML = '<div class="error">加载失败，请刷新重试</div>';
    });
}

function renderPosts(posts) {
  var el = document.getElementById('postsList');
  if (!posts.length) {
    el.innerHTML = '<div class="loading">暂无文章</div>';
    return;
  }
  el.innerHTML = posts.map(function(p, i) {
    return '<div class="post-card" onclick="openPost(\'' + p.slug + '\')" style="animation:fadeInUp 0.4s ease ' + (i*0.05) + 's both">
      <div class="post-header">
        <span class="post-category">' + (p.category || '文章') + '</span>
        <span class="post-date">' + (p.date || '') + '</span>
      </div>
      <div class="post-title">' + escapeHtml(p.title) + '</div>
      <div class="post-excerpt">' + escapeHtml((p.excerpt || '').substring(0, 120)) + '...</div>
      <div class="post-footer">
        <div class="post-tags">' + (p.tags || []).map(function(t){return '<span class="post-tag">'+escapeHtml(t)+'</span>'}).join('') + '</div>
        <div class="post-read">阅读全文 →</div>
      </div>
    </div>';
  }).join('');
}

// ===== 打开文章 =====
function openPost(slug) {
  showView('post');
  var el = document.getElementById('postDetailContent');
  el.className = 'post-content md';
  el.innerHTML = '<div class="loading"><div class="spinner"></div><div>加载中...</div></div>';
  
  fetch('/api/posts/' + slug)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        el.innerHTML = '<div class="error">文章不存在</div>';
        return;
      }
      
      // 标题和元信息
      document.getElementById('postDetailTitle').textContent = data.title || slug;
      document.getElementById('postMeta').innerHTML = 
        '<span class="post-category">' + (data.category || '文章') + '</span>' +
        '<span>' + (data.date || '') + '</span>' +
        (data.tags ? data.tags.map(function(t){return '<span class="post-tag">'+escapeHtml(t)+'</span>'}).join('') : '');
      
      // 内容
      if (data.type === 'html') {
        el.className = 'post-content html-content';
        el.innerHTML = data.content;
      } else {
        el.className = 'post-content md';
        el.innerHTML = renderMarkdown(data.content || '');
      }
    })
    .catch(function() {
      el.innerHTML = '<div class="error">加载失败</div>';
    });
}

// ===== 筛选文章 =====
function filterPosts(category) {
  currentFilter = category;
  showView('home');
  updateNavLinks();
  loadPosts(category);
}

// ===== 搜索 =====
function handleSearch(keyword) {
  var clear = document.querySelector('.search-btn');
  if (keyword) clear.style.opacity = '1';
  
  var kw = keyword.toLowerCase().trim();
  if (!kw) {
    renderPosts(allPosts);
    return;
  }
  
  var results = allPosts.filter(function(p) {
    return (p.title || '').toLowerCase().indexOf(kw) !== -1 ||
           (p.excerpt || '').toLowerCase().indexOf(kw) !== -1 ||
           (p.tags || []).some(function(t){ return t.toLowerCase().indexOf(kw) !== -1; });
  });
  renderPosts(results);
}

function searchTag(tag) {
  document.getElementById('searchInput').value = tag;
  handleSearch(tag);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  handleSearch('');
}

// ===== 统计更新 =====
function updateStats(data) {
  document.getElementById('postCount').textContent = data.total || 0;
  
  // 分类计数
  var counts = {日报:0, 预案:0, 案例:0, 讲义:0, 路线:0, 报告:0};
  (data.posts || []).forEach(function(p) {
    var cat = p.category || '其他';
    if (counts[cat] !== undefined) counts[cat]++;
  });
  document.getElementById('countDaily').textContent = counts.日报;
  document.getElementById('countPlan').textContent = counts.预案;
  document.getElementById('countCase').textContent = counts.案例;
  document.getElementById('countLecture').textContent = counts.讲义;
  document.getElementById('countRoute').textContent = counts.路线;
  document.getElementById('countReport').textContent = counts.报告;
  document.getElementById('countAll').textContent = data.total || 0;
}

// ===== Markdown渲染 =====
function renderMarkdown(md) {
  var lines = md.split('\n');
  var html = '', inTable = false, inList = false, inBlockquote = false;
  
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    
    // 表格
    if (line.trim().startsWith('|')) {
      if (!inTable) { html += '<table>'; inTable = true; }
      var cells = line.split('|').filter(function(c){ return c.trim() && !/^-+\|$/.test(c.trim()); });
      if (!cells.length) continue;
      var row = '';
      cells.forEach(function(c){ row += '<td>' + renderInline(c.trim()) + '</td>'; });
      html += '<tr>' + row + '</tr>';
      continue;
    } else if (inTable) { html += '</table>'; inTable = false; }
    
    // 引用
    if (line.trim().startsWith('>')) {
      if (!inBlockquote) { html += '<blockquote>'; inBlockquote = true; }
      html += '<p>' + renderInline(line.trim().substring(1).trim()) + '</p>';
      continue;
    } else if (inBlockquote) { html += '</blockquote>'; inBlockquote = false; }
    
    // 标题
    var h = /^(#{1,3})\s+(.+)$/.exec(line);
    if (h) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<h' + h[1].length + '>' + renderInline(h[2]) + '</h' + h[1].length + '>';
      continue;
    }
    
    // 列表
    var li = /^\s*[-*]\s+(.+)$/.exec(line);
    if (li) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + renderInline(li[1]) + '</li>';
      continue;
    } else if (inList) { html += '</ul>'; inList = false; }
    
    // 分隔线
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<hr>';
      continue;
    }
    
    if (!line.trim()) { html += '<p></p>'; continue; }
    html += '<p>' + renderInline(line.trim()) + '</p>';
  }
  
  if (inTable) html += '</table>';
  if (inList) html += '</ul>';
  if (inBlockquote) html += '</blockquote>';
  return html;
}

function renderInline(text) {
  var t = text;
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`(.+?)`/g, '<code>$1</code>');
  return t;
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== 滚动事件 =====
window.addEventListener('scroll', function() {
  var st = window.pageYOffset;
  
  // 进度条
  var docH = document.documentElement.scrollHeight - window.innerHeight;
  var pct = docH > 0 ? (st / docH) * 100 : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  
  // 回到顶部
  var btn = document.getElementById('backTop');
  btn.classList.toggle('show', st > 300);
});

// ===== 初始化 =====
window.addEventListener('load', function() {
  loadPosts('all');
  
  // 更新股票数量
  fetch('/api/stats')
    .then(function(r){return r.json()})
    .then(function(data){
      document.getElementById('stockCount').textContent = data.stocks || 0;
    });
    
  // 更新日期
  var now = new Date();
  document.getElementById('lastUpdate').textContent = 
    now.getFullYear() + '-' + 
    String(now.getMonth()+1).padStart(2,'0') + '-' + 
    String(now.getDate()).padStart(2,'0');
});
</script>
