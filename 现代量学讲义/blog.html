<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>量学实战</title>
<style>
:root {
  --primary: #6366f1;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  --bg: #0f172a;
  --card: #1e293b;
  --card-alt: #283548;
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --border: #334155;
  --accent: #f59e0b;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: #f7f9fc; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; padding-bottom: 60px; }
a { color: inherit; text-decoration: none; }

/* 顶部导航 */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 52px;
  background: rgba(15,23,42,0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; z-index: 100;
}
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-back {
  background: none; border: none; color: var(--text); font-size: 22px;
  cursor: pointer; padding: 4px;
}

/* 分类筛选 */
.filter-bar {
  position: fixed; top: 52px; left: 0; right: 0;
  background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; padding: 6px 12px;
  z-index: 99; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-item {
  flex-shrink: 0; padding: 5px 12px;
  font-size: 12px; color: var(--text-dim);
  border-bottom: 2px solid transparent; cursor: pointer;
}
.filter-item.active { color: var(--primary); border-bottom-color: var(--primary); }

/* 主内容 */
.main { padding-top: 100px; padding-bottom: 80px; }

/* 持仓卡片 */
.holding-card {
  margin: 8px 10px; padding: 12px 14px;
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
  border-radius: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.holding-info { display: flex; flex-direction: column; gap: 2px; }
.holding-label { font-size: 11px; color: rgba(255,255,255,0.6); }
.holding-value { font-size: 20px; font-weight: 700; }
.holding-value.up { color: var(--success); }
.holding-value.down { color: var(--danger); }

/* 文章列表 */
.post-list { padding: 8px 10px; }
.post-card {
  background: var(--card); border-radius: 8px;
  padding: 10px 14px; margin-bottom: 6px; cursor: pointer;
  transition: background 0.2s;
}
.post-card:active { background: var(--card-alt); }
.post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.post-cat {
  font-size: 10px; padding: 2px 7px; border-radius: 4px;
  background: rgba(99,102,241,0.15); color: var(--primary);
}
.post-date { font-size: 10px; color: var(--text-muted); }
.post-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
.post-excerpt { font-size: 12px; color: var(--text-dim); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 文章详情页 */
.post-view { display: none; position: fixed; inset: 0; z-index: 200; background: var(--bg); overflow-y: auto; }
.post-view.active { display: block; }

.post-header {
  padding: 16px 14px 12px; border-bottom: 1px solid var(--border);
  margin-top: 52px; display: flex; align-items: center; gap: 8px;
}
.post-header .topbar-back { flex-shrink: 0; }
.post-header .topbar-title { font-size: 14px; max-width: 60%; word-wrap: break-word; }
.post-badge {
  display: inline-block; padding: 4px 12px;
  background: rgba(245,158,11,0.15); color: var(--accent);
  border-radius: 999px; font-size: 12px; font-weight: 600;
  margin-bottom: 12px;
}
.post-title { font-size: 22px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
.post-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 16px; }

.post-content {
  padding: 14px; max-width: 100%; margin: 0 auto;
}
.post-content h1 { font-size: 19px; font-weight: 700; margin: 0 0 8px; }
.post-content h2 {
  font-size: 16px; font-weight: 700; margin: 18px 0 10px;
  padding-left: 8px; border-left: 3px solid var(--primary);
}
.post-content h3 { font-size: 14px; font-weight: 600; margin: 14px 0 8px; }
.post-content p { margin-bottom: 8px; font-size: 14px; line-height: 1.6; }
.post-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 11px; }
.post-content th, .post-content td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; }
.post-content th { background: var(--card); font-weight: 600; }
.post-content tr:nth-child(even) { background: rgba(255,255,255,0.02); }

/* 提示框 */
.callout {
  border-left: 3px solid var(--primary); background: rgba(99,102,241,0.08);
  padding: 10px 12px; border-radius: 0 6px 6px 0; margin: 10px 0;
  font-size: 13px;
}
.callout.warn { border-left-color: var(--warning); background: rgba(245,158,11,0.08); }
.callout.good { border-left-color: var(--success); background: rgba(16,185,129,0.08); }
.callout.danger { border-left-color: var(--danger); background: rgba(239,68,68,0.08); }
.callout-title { font-weight: 600; margin-bottom: 4px; font-size: 13px; }
.callout.warn .callout-title { color: var(--warning); }
.callout.good .callout-title { color: var(--success); }
.callout.danger .callout-title { color: var(--danger); }
.callout p { margin-bottom: 0; font-size: 13px; line-height: 1.6; }

/* 卡片 */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin: 12px 0;
}

/* 引用 */
blockquote {
  border-left: 3px solid var(--accent); background: rgba(245,158,11,0.06);
  padding: 10px 14px; margin: 12px 0; font-style: italic; font-size: 13px;
}
blockquote cite { display: block; margin-top: 6px; font-size: 11px; color: var(--text-muted); font-style: normal; }

/* 代码 */
.post-content code { background: var(--card); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.post-content pre { background: var(--card); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
.post-content pre code { background: none; padding: 0; font-size: 12px; }

/* 列表 */
.post-content ul, .post-content ol { padding-left: 18px; margin: 10px 0; }
.post-content li { margin: 4px 0; font-size: 13px; line-height: 1.6; }

/* 检查列表 */
.checklist { list-style: none; padding: 0; }
.checklist li { padding: 6px 0 6px 24px; position: relative; font-size: 13px; line-height: 1.5; }
.checklist li::before {
  content: '✓'; position: absolute; left: 0; top: 6px;
  width: 16px; height: 16px; background: rgba(16,185,129,0.15);
  color: var(--success); border-radius: 50%; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}

/* 步骤列表 */
.steps { list-style: none; padding: 0; counter-reset: step; }
.steps li {
  counter-increment: step; padding: 10px 0 10px 40px;
  position: relative; border-bottom: 1px dashed var(--border); font-size: 13px; line-height: 1.5;
}
.steps li:last-child { border-bottom: none; }
.steps li::before {
  content: counter(step); position: absolute; left: 0; top: 8px;
  width: 26px; height: 26px; background: var(--primary);
  color: white; border-radius: 50%; font-size: 12px;
  display: flex; align-items: center; justify-content: center; font-weight: 600;
}

/* 底部导航 */
.post-footer {
  padding: 16px 14px; border-top: 1px solid var(--border);
  margin-top: 24px;
}
.post-nav { display: flex; gap: 10px; margin-bottom: 16px; }
.post-nav-btn {
  flex: 1; padding: 10px 14px; border-radius: 6px;
  text-align: center; font-weight: 600; font-size: 13px;
  border: 1px solid var(--border); background: var(--card);
  cursor: pointer; transition: all 0.2s;
}
.post-nav-btn:hover { border-color: var(--primary); }
.post-quote { text-align: center; color: var(--text-muted); font-size: 12px; }

/* 底部导航 */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15,23,42,0.98); backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: flex; padding: 6px 0 10px 0; z-index: 100;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  background: none; border: none; color: var(--text-dim);
  font-size: 11px; cursor: pointer; gap: 2px; padding: 4px 8px;
}
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 18px; }

/* 占位符 */
.skeleton { animation: shimmer 1.5s infinite; background: linear-gradient(90deg, var(--card) 25%, #334155 50%, var(--card) 75%); background-size: 200%; }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

/* 移动端适配 */
@media (max-width: 768px) {
  .main { padding-top: 96px; padding-bottom: 60px; }
  .holding-card { margin: 6px 8px; padding: 10px 12px; }
  .holding-value { font-size: 18px; }
  .post-list { padding: 6px 8px; }
  .post-card { padding: 8px 10px; margin-bottom: 6px; }
  .post-title { font-size: 14px; }
  .post-excerpt { font-size: 12px; }
  
  .post-header { padding: 12px 12px 8px; margin-top: 52px; gap: 6px; }
  .post-header .topbar-title { font-size: 14px; max-width: 60%; }
  .post-badge { font-size: 10px; padding: 3px 8px; margin-bottom: 6px; }
  .post-title { font-size: 14px; }
  .post-meta { font-size: 11px; gap: 10px; }
  
  .post-content { padding: 12px; }
  .post-content h2 { font-size: 15px; margin: 16px 0 8px; border-left-width: 3px; }
  .post-content h3 { font-size: 13px; margin: 12px 0 6px; }
  .post-content p { font-size: 13px; line-height: 1.6; margin-bottom: 8px; }
  .post-content table { font-size: 10px; margin: 8px 0; }
  .post-content th, .post-content td { padding: 3px 5px; }
  .callout { padding: 8px 10px; margin: 8px 0; font-size: 12px; }
  .callout-title { font-size: 12px; }
  .callout p { font-size: 12px; }
  .card { padding: 10px; margin: 8px 0; }
  blockquote { padding: 6px 10px; font-size: 12px; margin: 8px 0; }
  .post-content code { font-size: 11px; }
  .post-content pre { padding: 8px; margin: 8px 0; }
  .post-content pre code { font-size: 11px; }
  .post-content ul, .post-content ol { padding-left: 14px; margin: 6px 0; }
  .post-content li { font-size: 12px; line-height: 1.6; }
  .checklist li { font-size: 12px; padding: 4px 0 4px 18px; }
  .steps li { font-size: 12px; padding: 6px 0 6px 30px; }
  .steps li::before { width: 22px; height: 22px; font-size: 10px; }
  .post-footer { padding: 10px 12px; margin-top: 16px; }
  .post-nav-btn { font-size: 12px; padding: 6px 10px; }
  .post-quote { font-size: 10px; }
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar" id="topbar">
  <button class="topbar-back" id="backBtn" style="display:none" onclick="closePost()">←</button>
  <div class="topbar-title" id="topbarTitle">量学实战</div>
  <button class="topbar-back" onclick="location.href='/dashboard.html'">📊</button>
</div>

<!-- 分类筛选 -->
<div class="filter-bar" id="filterBar">
  <div class="filter-item active" data-cat="all">全部</div>
  <div class="filter-item" data-cat="日报">日报</div>
  <div class="filter-item" data-cat="案例">案例</div>
  <div class="filter-item" data-cat="讲义">讲义</div>
  <div class="filter-item" data-cat="预案">预案</div>
  <div class="filter-item" data-cat="报告">报告</div>
</div>

<!-- 主内容区 -->
<div class="main" id="mainView">
  <!-- 持仓卡片 -->
  <div class="holding-card" id="holdingCard">
    <div class="holding-info">
      <div class="holding-label">总市值</div>
      <div class="holding-value" id="totalValue">--</div>
    </div>
    <div class="holding-info" style="text-align:right">
      <div class="holding-label">总盈亏</div>
      <div class="holding-value" id="totalProfit">--</div>
    </div>
  </div>
  
  <!-- 文章列表 -->
  <div class="post-list" id="postList">
    <div class="skeleton post-card" style="height:80px"></div>
    <div class="skeleton post-card" style="height:80px"></div>
    <div class="skeleton post-card" style="height:80px"></div>
  </div>
</div>

<!-- 文章详情页 -->
<div class="post-view" id="postView">
  <div class="post-header" id="postHeader">
    <div class="post-badge" id="postBadge">文章</div>
    <h1 class="post-title" id="postTitle">加载中...</h1>
    <div class="post-meta">
      <span id="postDate"></span>
      <span id="postCategory"></span>
    </div>
  </div>
  <div class="post-content" id="postContent"></div>
  <div class="post-footer">
    <div class="post-nav">
      <button class="post-nav-btn" onclick="prevPost()">← 上一篇</button>
      <button class="post-nav-btn" onclick="nextPost()">下一篇 →</button>
    </div>
    <p class="post-quote">持续学习，精进交易</p>
  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('home')">
    <span class="nav-icon">🏠</span>
    <span>首页</span>
  </button>
  <button class="nav-item" onclick="location.href='/dashboard.html'">
    <span class="nav-icon">📊</span>
    <span>持仓</span>
  </button>
  <button class="nav-item" onclick="filterCat('案例')">
    <span class="nav-icon">📈</span>
    <span>案例</span>
  </button>
  <button class="nav-item" onclick="filterCat('讲义')">
    <span class="nav-icon">📚</span>
    <span>讲义</span>
  </button>
</div>

<script>
var allPosts = [];
var currentCat = 'all';
var currentPostIndex = -1;

// 初始化
function init() {
  loadHoldings();
  loadPosts('all');
  setupFilter();
  checkUrlParams();
}

// 加载持仓
function loadHoldings() {
  fetch('/api/portfolio')
    .then(r => r.json())
    .then(d => {
      if (d.total_value) {
        document.getElementById('totalValue').textContent = '¥' + d.total_value.toLocaleString();
      }
      if (d.profit_pct !== undefined) {
        var pct = d.profit_pct || 0;
        var el = document.getElementById('totalProfit');
        el.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
        el.className = 'holding-value ' + (pct >= 0 ? 'up' : 'down');
      }
    })
    .catch(e => console.log('Holdings error:', e));
}

// 加载文章
function loadPosts(cat) {
  var url = '/api/posts?limit=100';
  if (cat && cat !== 'all') url += '&category=' + encodeURIComponent(cat);
  
  fetch(url)
    .then(r => r.json())
    .then(d => {
      allPosts = d.posts || [];
      renderPosts(allPosts);
    })
    .catch(e => {
      document.getElementById('postList').innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8">加载失败</div>';
    });
}

// 渲染文章列表
function renderPosts(posts) {
  var html = '';
  if (!posts.length) {
    html = '<div style="text-align:center;padding:60px 20px;color:#64748b">暂无文章</div>';
  } else {
    posts.forEach(function(p, i) {
      var excerpt = (p.excerpt || '').substring(0, 80) + '...';
      html += '<div class="post-card" onclick="openPost(\'' + p.slug + '\', ' + i + ')">' +
        '<div class="post-header">' +
          '<span class="post-cat">' + escapeHtml(p.category || '文章') + '</span>' +
          '<span class="post-date">' + escapeHtml(p.date || '') + '</span>' +
        '</div>' +
        '<div class="post-title">' + escapeHtml(p.title || p.slug) + '</div>' +
        '<div class="post-excerpt">' + escapeHtml(excerpt) + '</div>' +
      '</div>';
    });
  }
  document.getElementById('postList').innerHTML = html;
}

// 打开文章
function openPost(slug, index) {
  currentPostIndex = index >= 0 ? index : -1;
  
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('postView').classList.add('active');
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('topbarTitle').textContent = '文章';
  window.scrollTo(0, 0);
  
  var el = document.getElementById('postContent');
  el.innerHTML = '<div style="text-align:center;padding:40px"><div class="skeleton" style="height:20px;width:60px;margin:0 auto 16px;border-radius:4px"></div></div>';
  
  fetch('/api/posts/' + encodeURIComponent(slug))
    .then(r => r.json())
    .then(d => {
      if (d.error) {
        el.innerHTML = '<div style="text-align:center;padding:40px;color:#f87171">文章不存在</div>';
        return;
      }
      
      // 更新标题和元信息
      document.getElementById('postTitle').textContent = d.title || slug;
      document.getElementById('postBadge').textContent = d.category || '文章';
      document.getElementById('postDate').textContent = d.date || '';
      document.getElementById('postCategory').textContent = d.category || '';
      
      // 渲染内容
      if (d.type === 'html') {
        renderHtmlContent(d.content);
      } else {
        el.innerHTML = renderMarkdown(d.content || '');
      }
    })
    .catch(e => {
      el.innerHTML = '<div style="text-align:center;padding:40px;color:#f87171">加载失败</div>';
    });
}

// 渲染HTML内容
function renderHtmlContent(content) {
  var el = document.getElementById('postContent');
  
  // 提取title
  var titleMatch = content.match(/<title>([\s\S]*?)<\/title>/i);
  if (titleMatch) {
    document.getElementById('postTitle').textContent = titleMatch[1].trim();
  }
  
  // 清理HTML
  content = content.replace(/<script[\s\S]*?<\/script>/gi, '');
  content = content.replace(/<style[\s\S]*?<\/style>/gi, '');
  content = content.replace(/<meta[^>]*>/gi, '');
  content = content.replace(/<link[^>]*>/gi, '');
  
  // 提取body内容
  var bodyMatch = content.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  if (bodyMatch) {
    content = bodyMatch[1];
  } else {
    content = content.replace(/^[^<]*/, '').replace(/<\/?[^>]+>$/, '');
  }
  
  // 清理空白
  content = content.replace(/^\s+/, '').replace(/\s+$/, '');
  
  el.innerHTML = content;
}

// 关闭文章
function closePost() {
  document.getElementById('postView').classList.remove('active');
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('topbarTitle').textContent = '量学实战';
}

// 筛选分类
function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.filter-item').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === cat);
  });
  loadPosts(cat);
}

// 设置筛选器
function setupFilter() {
  document.querySelectorAll('.filter-item').forEach(el => {
    el.addEventListener('click', function() {
      filterCat(this.dataset.cat);
    });
  });
}

// 切换标签
function switchTab(tab) {
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', (tab === 'home' && i === 0));
  });
}

// 上一篇/下一篇
function prevPost() {
  if (currentPostIndex > 0) {
    openPost(allPosts[currentPostIndex - 1].slug, currentPostIndex - 1);
  }
}

function nextPost() {
  if (currentPostIndex >= 0 && currentPostIndex < allPosts.length - 1) {
    openPost(allPosts[currentPostIndex + 1].slug, currentPostIndex + 1);
  }
}

// 检查URL参数
function checkUrlParams() {
  var hash = window.location.hash;
  if (hash.startsWith('#post=')) {
    var slug = decodeURIComponent(hash.substring(6));
    var idx = allPosts.findIndex(p => p.slug === slug);
    if (idx >= 0) {
      setTimeout(function() { openPost(slug, idx); }, 500);
    }
  }
}

// 转义HTML
function escapeHtml(text) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(text));
  return div.innerHTML;
}

// Markdown渲染
function renderMarkdown(md) {
  var html = md
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
    .replace(/\*(.*)\*/gim, '<em>$1</em>')
    .replace(/`([^`]+)`/gim, '<code>$1</code>')
    .replace(/\n/gim, '<br>');
  return html;
}

// 初始化
init();
</script>
</body>
</html>
