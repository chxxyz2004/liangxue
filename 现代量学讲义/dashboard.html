<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持仓跟踪 - 量学系统</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--orange:#d29922}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:16px;padding-bottom:80px}
a{text-decoration:none;color:inherit}
.header{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.header h1{font-size:18px;margin-bottom:4px}
.header p{font-size:12px;color:var(--dim)}
.portfolio-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.portfolio-total{display:flex;justify-content:space-between;align-items:center}
.portfolio-label{font-size:14px;color:var(--dim)}
.portfolio-value{font-size:28px;font-weight:700}
.portfolio-profit{font-size:16px;margin-top:4px}
.pos-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.pos-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.pos-name{font-size:16px;font-weight:600}
.pos-code{font-size:12px;color:var(--dim)}
.pos-price{text-align:right}
.pos-current{font-size:20px;font-weight:700}
.pos-pct{font-size:14px;font-weight:600}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pos-item{background:var(--bg);border-radius:8px;padding:8px}
.pos-item-label{font-size:11px;color:var(--dim);margin-bottom:2px}
.pos-item-value{font-size:14px;font-weight:600}
.pos-signals{display:flex;gap:8px;flex-wrap:wrap}
.signal-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}
.signal-buy{background:rgba(63,185,80,0.2);color:var(--green)}
.signal-sell{background:rgba(248,81,73,0.2);color:var(--red)}
.signal-warn{background:rgba(210,153,34,0.2);color:var(--orange)}
.signal-neutral{background:rgba(139,148,158,0.2);color:var(--dim)}
.ma-row{display:flex;gap:12px;margin-top:8px;font-size:11px;color:var(--dim)}
.ma-row span{display:flex;align-items:center;gap:4px}
.ma-above{color:var(--green)}
.ma-below{color:var(--red)}
</style>
</head>
<body>

<div class="header">
    <h1>持仓跟踪</h1>
    <p id="update-time">加载中...</p>
</div>

<div class="portfolio-card">
    <div class="portfolio-total">
        <div>
            <div class="portfolio-label">总市值</div>
            <div class="portfolio-value" id="total-value">--</div>
        </div>
        <div style="text-align:right">
            <div class="portfolio-label">总盈亏</div>
            <div class="portfolio-profit" id="total-profit">--</div>
        </div>
    </div>
</div>

<div id="holdings-list"></div>

<script>
async function fetchHoldings() {
    try {
        const res = await fetch('/api/holdings');
        return await res.json();
    } catch(e) {
        console.error('Fetch error:', e);
        return null;
    }
}

function formatNum(n) {
    if (n == null) return '--';
    return n.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function renderHoldings(data) {
    if (!data || !data.holdings) return;
    
    let totalValue = 0, totalCost = 0;
    data.holdings.forEach(h => {
        totalValue += h.market_value;
        if (h.cost) totalCost += h.cost * h.shares;
    });
    
    const totalProfit = totalValue - totalCost;
    const totalPct = totalCost > 0 ? (totalProfit / totalCost * 100) : 0;
    
    document.getElementById('total-value').textContent = '¥' + formatNum(totalValue);
    const profitEl = document.getElementById('total-profit');
    profitEl.textContent = (totalProfit >= 0 ? '+' : '') + '¥' + formatNum(totalProfit);
    profitEl.style.color = totalProfit >= 0 ? 'var(--green)' : 'var(--red)';
    
    const now = new Date();
    document.getElementById('update-time').textContent = 
        '更新时间: ' + now.toLocaleString('zh-CN') + ' | 数据源: 新浪/东财';
    
    const list = document.getElementById('holdings-list');
    list.innerHTML = '';
    
    data.holdings.forEach(h => {
        const profitPct = h.cost ? ((h.current_price - h.cost) / h.cost * 100) : 0;
        const isProfit = h.profit >= 0;
        
        let maHtml = '';
        if (h.ma && Object.keys(h.ma).length > 0) {
            const maKeys = ['ma5','ma10','ma20','ma60'];
            maHtml = '<div class="ma-row">';
            maKeys.forEach(k => {
                if (h.ma[k]) {
                    const above = h.current_price >= h.ma[k];
                    maHtml += `<span class="${above ? 'ma-above' : 'ma-below'}">${k}: ${formatNum(h.ma[k])}</span>`;
                }
            });
            maHtml += '</div>';
        }
        
        let signalsHtml = '';
        const riskColor = h.risk_level === '低风险' ? 'signal-buy' : 
                         h.risk_level === '中风险' ? 'signal-warn' : 'signal-sell';
        signalsHtml += `<span class="signal-tag ${riskColor}">${h.risk_level}</span>`;
        
        if (h.cross_signal && h.cross_signal.includes('死叉')) {
            signalsHtml += `<span class="signal-tag signal-sell">MACD死叉</span>`;
        } else if (h.cross_signal && h.cross_signal.includes('金叉')) {
            signalsHtml += `<span class="signal-tag signal-buy">MACD金叉</span>`;
        }
        
        if (h.volume_ratio !== null && h.volume_ratio < 0.5) {
            signalsHtml += `<span class="signal-tag signal-neutral">缩量${h.volume_ratio.toFixed(2)}</span>`;
        } else if (h.volume_ratio !== null && h.volume_ratio > 2) {
            signalsHtml += `<span class="signal-tag signal-warn">放量${h.volume_ratio.toFixed(2)}</span>`;
        }
        
        const card = document.createElement('div');
        card.className = 'pos-card';
        card.innerHTML = `
            <div class="pos-header">
                <div>
                    <div class="pos-name">${h.name}</div>
                    <div class="pos-code">${h.symbol} · ${h.shares}股</div>
                </div>
                <div class="pos-price">
                    <div class="pos-current">${formatNum(h.current_price)}</div>
                    <div class="pos-pct" style="color:${isProfit ? 'var(--green)' : 'var(--red)'}">
                        ${isProfit ? '+' : ''}${formatNum(profitPct)}%
                    </div>
                </div>
            </div>
            <div class="pos-grid">
                <div class="pos-item">
                    <div class="pos-item-label">市值</div>
                    <div class="pos-item-value">¥${formatNum(h.market_value)}</div>
                </div>
                <div class="pos-item">
                    <div class="pos-item-label">盈亏</div>
                    <div class="pos-item-value" style="color:${isProfit ? 'var(--green)' : 'var(--red)'}">
                        ${isProfit ? '+' : ''}¥${formatNum(h.profit)}
                    </div>
                </div>
                <div class="pos-item">
                    <div class="pos-item-label">成本价</div>
                    <div class="pos-item-value">¥${formatNum(h.cost)}</div>
                </div>
            </div>
            <div class="pos-grid" style="grid-template-columns:repeat(2,1fr)">
                <div class="pos-item">
                    <div class="pos-item-label">止损线</div>
                    <div class="pos-item-value" style="color:var(--red)">¥${formatNum(h.stop_loss)}</div>
                </div>
                <div class="pos-item">
                    <div class="pos-item-label">生命线</div>
                    <div class="pos-item-value" style="color:var(--orange)">¥${formatNum(h.life_line)}</div>
                </div>
            </div>
            ${maHtml}
            <div class="pos-signals" style="margin-top:8px">${signalsHtml}</div>
        `;
        list.appendChild(card);
    });
}

fetchHoldings().then(renderHoldings).catch(err => {
    document.getElementById('holdings-list').innerHTML = 
        '<div style="padding:20px;text-align:center;color:var(--red)">加载失败，请检查服务</div>';
});
</script>
</body>
</html>
